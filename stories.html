<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AHON - Stories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="stories">

  <!-- ========== NAVBAR ========== -->
  <nav class="navbar">
    <a class="nav-logos" href="index.html" aria-label="AHON Home">
      <div class="img-slot " data-label="AHON logo"><img src="images/logo-ahon.png" alt=""></div>
      <div class="img-slot " data-label="Colgante seal"><img src="images/logo-colgante.png" alt=""></div>
    </a>
    <button class="nav-toggle" aria-label="Open menu" aria-expanded="false"><span></span></button>
    <ul class="nav-links">
      <li><a href="index.html" data-page="home"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v9h6v-6h2v6h6v-9h3z"/></svg>Home</a></li>
      <li><a href="about.html" data-page="about"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2zm0-8h-2V7h2z"/></svg>About</a></li>
      <li><a href="stories.html" data-page="stories"><svg viewBox="0 0 24 24"><path d="M12 4C7 4 4 7.5 4 12v1H2v3h20v-3h-2v-1c0-4.5-3-8-8-8zm-1 2.1V11h2V6.1c2.8.5 5 2.8 5 5.9v1H6v-1c0-3.1 2.2-5.4 5-5.9z"/></svg>Stories</a></li>
      <li><a href="donate.html" data-page="donate"><svg viewBox="0 0 24 24"><path d="M16 3a3 3 0 0 0-3 3c0 2.2 3 4.5 3 4.5S19 8.2 19 6a3 3 0 0 0-3-3zM2 13h4v8H2zm6 0h3.6l4.4 1.6c.8.3 1.1 1.2.6 1.9-.3.4-.8.6-1.3.5L11 16v1l4 1.1c1 .3 2.1 0 2.8-.7L22 14c-.6-1-1.9-1.3-2.9-.7L16 15l-4.6-2.5c-.5-.3-1-.5-1.6-.5H8z"/></svg>Donate</a></li>
      <li><a href="feedback.html" data-page="feedback"><svg viewBox="0 0 24 24"><path d="M3 3h18v14H7l-4 4z"/></svg>Feedback</a></li>
    </ul>
  </nav>

  <!-- ========== SHOWCASE (Before / During / After) ========== -->
  <section class="showcase">
    <div class="showcase-bar">
      <h2>SHOWCASE</h2>
      <div class="showcase-buttons">
        <button class="pill active" data-phase="before">Before</button>
        <button class="pill" data-phase="during">During</button>
        <button class="pill" data-phase="after">After</button>
      </div>
    </div>
    <div class="showcase-stage">
      <img class="show" data-phase="before" src="images/showcase/before.jpg" alt="Bago ang bagyo">
      <img data-phase="during" src="images/showcase/during.jpg" alt="Sa gitna ng bagyo">
      <img data-phase="after" src="images/showcase/after.jpg" alt="Pagkatapos ng bagyo">
    </div>
  </section>

  <!-- ========== STORIES BANNER ========== -->
  <section class="stories-banner">
    <img src="images/stories-banner.jpg" alt="Stories">
    <h1 class="visually-hidden">STORIES</h1>
  </section>

  <!-- ========== RESPONDER CARDS (filled in by js/script.js) ========== -->
  <section class="cards-section" id="cards">
    <div class="cards-grid" id="cards-grid"></div>
    <div class="pagination" id="pagination"></div>
  </section>

  <footer class="site-footer">© Proyektong AHON · Barangay Colgante, Apalit, Pampanga</footer>
  <script src="js/script.js"></script>
</body>
</html>
